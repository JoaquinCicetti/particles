<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#cad86e" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Growcast — Monitoreo, control y automatización agroindustrial</title>
    <meta
      name="description"
      content="Growcast conecta una operación física con su teléfono, tablet o PC: monitoreo en tiempo real, alertas, históricos y, cuando la instalación lo permite, control de equipos."
    />
    <meta name="theme-color" content="#1c1c20" />
    <!-- Drop any incoming #fragment before the parser finishes, so the browser
         never acquires a scroll target. Doing this from the app is too late:
         by the time React mounts, the fragment scroll is already scheduled,
         and it re-fires as the lazy sections grow the page under it. The story
         has to start at the top — the loader, the camera rig and the particle
         windows are all keyed to scroll 0. In-page navigation still writes the
         hash as you travel (see setSection). -->
    <script>
      if (location.hash) {
        history.replaceState(null, '', location.pathname + location.search)
      }
      history.scrollRestoration = 'manual'
    </script>
    <!-- above-the-fold faces: body copy (400) and the hero headline (500) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Aeonik-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Aeonik-Medium.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
