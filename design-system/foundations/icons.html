<!-- @dsCard group="Foundations" name="Icons" subtitle="16px domain glyphs, stroke 1.3, round joins, tinted lime" viewport="1000x420" -->
<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<title>Growcast — Icons</title>
<link rel="stylesheet" href="../styles.css" />
<style>
/* demo scaffolding only */
.demo { padding: 32px 36px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; margin-top: 14px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 8px 12px; border: 1px solid var(--brand-faint); border-radius: var(--radius); background: var(--glass); }
.cell svg { width: 28px; height: 28px; color: var(--brand); fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.cell span { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.18em; color: var(--dz-text-2); }
.inline { display: flex; gap: 28px; align-items: center; margin-top: 26px; font-weight: 300; }
.inline svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px; color: var(--brand); fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<main class="demo">
  <div class="metric-label">Domain glyphs · viewBox 16</div>
  <div class="grid">
    <div class="cell"><svg viewBox="0 0 16 16"><rect x="3.5" y="5.5" width="9" height="8" rx="1.2"/><path d="M8 5.5V2.5M5.8 9.5h4.4"/></svg><span>NODE</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><path d="M8 2.2v7.6M5.4 4.4h5.2"/><circle cx="8" cy="11.8" r="2"/></svg><span>PROBE</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><path d="M3 6.4 8 9 3 11.6zM13 6.4 8 9l5 2.6zM8 9V4.6M5.8 3.6h4.4"/></svg><span>VALVE</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><path d="M8 2.4 14.6 13.6H1.4zM8 6.6v3.4M8 12v.4"/></svg><span>ALERT</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><path d="M5 12.5h6.5a2.8 2.8 0 0 0 .3-5.6A4 4 0 0 0 4.2 8 2.3 2.3 0 0 0 5 12.5z"/></svg><span>CO₂</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="1.5"/><path d="M8 6.5V2.4M9.5 8V12.1M6.5 8V3.9M8 9.5V13.6M9.5 8H13.6M6.5 8H2.4"/></svg><span>FAN</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><rect x="4" y="1.8" width="8" height="12.4" rx="1.4"/><path d="M6.8 12.2h2.4"/></svg><span>PHONE</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><path d="M8 2v12M2.8 5l10.4 6M13.2 5 2.8 11"/></svg><span>COOLING</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><path d="M2 13V3M2 13h12M4 11.5c2.4 0 3-7 5.4-7 1.8 0 2.2 3.2 4.1 3.2"/></svg><span>CURVE</span></div>
    <div class="cell"><svg viewBox="0 0 16 16"><rect x="3.5" y="2.2" width="9" height="11.6" rx="1.2"/><path d="M5.8 5.4h4.4M5.8 8h4.4M5.8 10.6h3"/></svg><span>LOG</span></div>
    <div class="cell"><svg viewBox="0 0 16 16" style="color:var(--brand-bright);stroke-width:1.6"><path d="M2.5 8.5l3.5 3.5 7.5-8"/></svg><span>CHECK</span></div>
  </div>
  <div class="inline">
    <span><svg viewBox="0 0 16 16"><path d="M8 2.2v7.6M5.4 4.4h5.2"/><circle cx="8" cy="11.8" r="2"/></svg>Sonda en el grano</span>
    <span><svg viewBox="0 0 16 16"><path d="M5 12.5h6.5a2.8 2.8 0 0 0 .3-5.6A4 4 0 0 0 4.2 8 2.3 2.3 0 0 0 5 12.5z"/></svg>CO₂ 850 ppm</span>
  </div>
</main>
</body>
</html>
